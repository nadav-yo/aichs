name: publish
run-name: Publish ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.2.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  wheels:
    name: Build ${{ matrix.name }} wheel
    if: github.actor == 'nadav-yo'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            artifact: wheel-linux-x64
            manylinux: true
            wheel_platform_tag: manylinux_2_28_x86_64
          - name: Windows x64
            os: windows-latest
            artifact: wheel-windows-x64
            manylinux: false
            wheel_platform_tag: win_amd64
          - name: macOS Apple Silicon
            os: macos-14
            artifact: wheel-macos-arm64
            manylinux: false
            wheel_platform_tag: macosx_11_0_arm64

    env:
      AICHS_WHEEL_PLATFORM_TAG: ${{ matrix.wheel_platform_tag }}

    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        if: ${{ !matrix.manylinux }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Rust
        if: ${{ !matrix.manylinux }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ripgrep (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo install --locked ripgrep --version 14.1.1

      - name: Install Ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ripgrep --yes --no-progress

      - name: Install wheel build tools
        if: ${{ !matrix.manylinux }}
        run: python -m pip install --upgrade build

      - name: Stage native helpers
        if: ${{ !matrix.manylinux }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: python tools/stage_native_search.py

      - name: Build platform wheel
        if: ${{ !matrix.manylinux }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: python -m build --wheel

      - name: Build manylinux platform wheel
        if: matrix.manylinux
        run: |
          docker run --rm \
            -e AICHS_WHEEL_PLATFORM_TAG \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -ec '
              dnf install --assumeyes curl gcc gcc-c++ make
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source "$HOME/.cargo/env"
              cargo install --locked ripgrep --version 14.1.1
              /opt/python/cp311-cp311/bin/python -m pip install --upgrade build
              /opt/python/cp311-cp311/bin/python tools/stage_native_search.py
              /opt/python/cp311-cp311/bin/python -m build --wheel
            '

      - name: Verify native helpers are in the wheel
        shell: python
        run: |
          import pathlib
          import os
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          expected_tag = os.environ["AICHS_WHEEL_PLATFORM_TAG"]
          assert wheels[0].name.endswith(f"-{expected_tag}.whl"), wheels[0]
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          suffix = ".exe" if __import__("sys").platform == "win32" else ""
          assert any(name.endswith("aichs_native/THIRD_PARTY_NOTICES.md") for name in names)
          assert any(name.endswith(f"aichs_native/bin/rg{suffix}") for name in names)
          assert any(name.endswith(f"aichs_native/bin/aichs-indexer{suffix}") for name in names)

      - name: Upload platform wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  pypi:
    name: Publish tag to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    if: github.actor == 'nadav-yo'
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${REF_NAME}"
          fi
          case "${tag}" in
            v*) ;;
            *)
              echo "publish.yml only publishes v* tags, got '${tag}'." >&2
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Check out tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag checkout
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          actual="$(git describe --tags --exact-match)"
          if [ "${actual}" != "${TAG}" ]; then
            echo "Expected to build ${TAG}, checked out ${actual}." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Download platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Build source distribution
        run: python -m build --sdist

      - name: Verify distributions
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import re
          import sys

          expected = os.environ["VERSION"]
          files = [os.path.basename(path) for path in glob.glob("dist/*")]
          if not files:
              print("No distributions were built.", file=sys.stderr)
              sys.exit(1)
          pattern = re.compile(rf"^aichs-{re.escape(expected)}(?:\.tar\.gz|-)")
          bad = [name for name in files if not pattern.match(name)]
          if bad:
              print(f"Built files do not match release version {expected}: {bad}", file=sys.stderr)
              sys.exit(1)
          wheels = [name for name in files if name.endswith(".whl")]
          if len(wheels) != 3 or any("none-any.whl" in name for name in wheels):
              print(f"Expected three platform wheels, got: {wheels}", file=sys.stderr)
              sys.exit(1)
          PY
          python -m twine check dist/*

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Mark GitHub release as published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          notes="$(cat <<EOF
          Release ${TAG}.

          Published to PyPI: https://pypi.org/project/aichs/${VERSION}/
          EOF
          )"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes "${notes}"
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes "${notes}"
          fi

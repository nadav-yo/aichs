[package]
name = "aichs-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22.1"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
